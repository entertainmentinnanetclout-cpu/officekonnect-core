name: Phase 8 Generated Type Reconciliation

on:
  push:
    branches:
      - phase-0-canonical-reconciliation
    paths:
      - '.github/workflows/phase8-types-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0-canonical-reconciliation
      - name: Reconcile Phase 8 live generated definitions
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/integrations/supabase/types.ts")
          text = path.read_text()

          receipts = '''      notification_receipts: {
                  Row: {
                    archived_at: string | null;
                    created_at: string;
                    notification_id: string;
                    read_at: string | null;
                    updated_at: string;
                    user_id: string;
                  };
                  Insert: {
                    archived_at?: string | null;
                    created_at?: string;
                    notification_id: string;
                    read_at?: string | null;
                    updated_at?: string;
                    user_id: string;
                  };
                  Update: {
                    archived_at?: string | null;
                    created_at?: string;
                    notification_id?: string;
                    read_at?: string | null;
                    updated_at?: string;
                    user_id?: string;
                  };
                  Relationships: [
                    {
                      foreignKeyName: "notification_receipts_notification_id_fkey";
                      columns: ["notification_id"];
                      isOneToOne: false;
                      referencedRelation: "notifications";
                      referencedColumns: ["id"];
                    },
                  ];
                };
          '''

          invitations = '''      workspace_invitations: {
                  Row: {
                    accepted_at: string | null;
                    accepted_by: string | null;
                    created_at: string;
                    email: string;
                    expires_at: string;
                    id: string;
                    invited_by: string;
                    revoked_at: string | null;
                    role: Database["public"]["Enums"]["workspace_role"];
                    token_hash: string;
                    updated_at: string;
                    workspace_id: string;
                  };
                  Insert: {
                    accepted_at?: string | null;
                    accepted_by?: string | null;
                    created_at?: string;
                    email: string;
                    expires_at: string;
                    id?: string;
                    invited_by: string;
                    revoked_at?: string | null;
                    role?: Database["public"]["Enums"]["workspace_role"];
                    token_hash: string;
                    updated_at?: string;
                    workspace_id: string;
                  };
                  Update: {
                    accepted_at?: string | null;
                    accepted_by?: string | null;
                    created_at?: string;
                    email?: string;
                    expires_at?: string;
                    id?: string;
                    invited_by?: string;
                    revoked_at?: string | null;
                    role?: Database["public"]["Enums"]["workspace_role"];
                    token_hash?: string;
                    updated_at?: string;
                    workspace_id?: string;
                  };
                  Relationships: [
                    {
                      foreignKeyName: "workspace_invitations_workspace_id_fkey";
                      columns: ["workspace_id"];
                      isOneToOne: false;
                      referencedRelation: "workspaces";
                      referencedColumns: ["id"];
                    },
                  ];
                };
          '''

          functions = '''      accept_workspace_invitation: {
                  Args: { p_token: string };
                  Returns: {
                    role: Database["public"]["Enums"]["workspace_role"];
                    workspace_id: string;
                    workspace_name: string;
                  }[];
                };
                accept_workspace_invitation_by_id: {
                  Args: { p_invitation_id: string };
                  Returns: {
                    role: Database["public"]["Enums"]["workspace_role"];
                    workspace_id: string;
                    workspace_name: string;
                  }[];
                };
                count_unread_workspace_notifications: {
                  Args: { p_workspace_id: string };
                  Returns: number;
                };
                create_workspace: {
                  Args: { p_name: string };
                  Returns: {
                    name: string;
                    slug: string;
                    workspace_id: string;
                  }[];
                };
                create_workspace_invitation: {
                  Args: {
                    p_email: string;
                    p_expires_in_days?: number;
                    p_role?: Database["public"]["Enums"]["workspace_role"];
                    p_workspace_id: string;
                  };
                  Returns: {
                    expires_at: string;
                    invitation_id: string;
                    raw_token: string;
                  }[];
                };
                list_my_workspace_invitations: {
                  Args: never;
                  Returns: {
                    created_at: string;
                    email: string;
                    expires_at: string;
                    invitation_id: string;
                    invited_by: string;
                    inviter_name: string;
                    role: Database["public"]["Enums"]["workspace_role"];
                    workspace_id: string;
                    workspace_name: string;
                  }[];
                };
                list_workspace_activity: {
                  Args: { p_limit?: number; p_offset?: number; p_workspace_id: string };
                  Returns: {
                    action: string;
                    actor_id: string;
                    actor_name: string;
                    entity_id: string;
                    entity_type: string;
                    event_id: string;
                    metadata: Json;
                    occurred_at: string;
                    route: string;
                    source: string;
                  }[];
                };
                list_workspace_invitations: {
                  Args: { p_workspace_id: string };
                  Returns: {
                    created_at: string;
                    email: string;
                    expires_at: string;
                    invitation_id: string;
                    invited_by: string;
                    inviter_name: string;
                    role: Database["public"]["Enums"]["workspace_role"];
                  }[];
                };
                list_workspace_notifications: {
                  Args: {
                    p_limit?: number;
                    p_offset?: number;
                    p_unread_only?: boolean;
                    p_workspace_id: string;
                  };
                  Returns: {
                    body: string;
                    created_at: string;
                    data: Json;
                    delivered_channels: Json;
                    effective_read_at: string;
                    entity_id: string;
                    entity_type: string;
                    id: string;
                    is_broadcast: boolean;
                    kind: string;
                    title: string;
                  }[];
                };
                mark_all_workspace_notifications_read: {
                  Args: { p_workspace_id: string };
                  Returns: number;
                };
                mark_notification_read: {
                  Args: { p_notification_id: string };
                  Returns: undefined;
                };
                remove_workspace_member: {
                  Args: { p_user_id: string; p_workspace_id: string };
                  Returns: undefined;
                };
                revoke_workspace_invitation: {
                  Args: { p_invitation_id: string };
                  Returns: undefined;
                };
                update_workspace_member_role: {
                  Args: {
                    p_role: Database["public"]["Enums"]["workspace_role"];
                    p_user_id: string;
                    p_workspace_id: string;
                  };
                  Returns: undefined;
                };
          '''

          if "      notification_receipts: {" not in text:
              marker = "      notifications: {"
              if marker not in text:
                  raise SystemExit("notifications table marker missing")
              text = text.replace(marker, receipts + marker, 1)

          if "      workspace_invitations: {" not in text:
              marker = "      workspace_members: {"
              if marker not in text:
                  raise SystemExit("workspace_members table marker missing")
              text = text.replace(marker, invitations + marker, 1)

          if "      accept_workspace_invitation: {" not in text:
              marker = "    Functions: {\n      cancel_document_workflow: {"
              if marker not in text:
                  raise SystemExit("Functions marker missing")
              text = text.replace(marker, "    Functions: {\n" + functions + "      cancel_document_workflow: {", 1)

          path.write_text(text)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bunx prettier --write src/integrations/supabase/types.ts
      - run: bun run typecheck
      - name: Commit generated type reconciliation
        run: |
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo 'Generated types already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/integrations/supabase/types.ts
          git commit -m 'chore(phase8): reconcile generated Supabase types'
          git push
