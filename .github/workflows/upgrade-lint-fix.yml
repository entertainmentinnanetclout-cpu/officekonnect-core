name: Upgrade Lint Autofix

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/upgrade-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Apply ESLint autofixes
        run: bunx eslint . --fix || true

      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No autofixes required."
          else
            git commit -m "style: apply upgrade lint autofixes"
            git push origin HEAD:phase-0-canonical-reconciliation
          fi
