name: Phase 2 Test Typing Fix

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/phase2-test-types.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Add Bun test types
        run: bun add --dev @types/bun
      - name: Guard PDF page lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/lib/native-document-pdf.server.test.ts")
          s = p.read_text()
          old = '''    const pdf = await PDFDocument.load(rendered.bytes);\n    const { width, height } = pdf.getPage(0).getSize();\n    expect(width).toBe(792);\n'''
          new = '''    const pdf = await PDFDocument.load(rendered.bytes);\n    const page = pdf.getPage(0);\n    expect(page).toBeDefined();\n    if (!page) throw new Error("Expected the rendered PDF to contain one page");\n    const { width, height } = page.getSize();\n    expect(width).toBe(792);\n'''
          if old not in s:
            raise SystemExit("expected landscape page assertion not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - run: bunx prettier --write package.json src/lib/native-document-pdf.server.test.ts
      - name: Commit test typing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/lib/native-document-pdf.server.test.ts
          git commit -m "test(phase2): type Bun document regression suite"
          git push origin HEAD:phase-0-canonical-reconciliation
