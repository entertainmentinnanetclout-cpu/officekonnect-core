name: Phase 2 Apply Editor Hardening

# Retried after the Bun test typing checkpoint to avoid a non-fast-forward bot push.
on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/phase2-editor-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Patch editor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/components/document/native-document-editor.tsx")
          s = p.read_text()

          replacements = [
            ("  FileDown,\n  Heading1,", "  FileDown,\n  FileSignature,\n  Heading1,"),
            ('import { toast } from "sonner";\n', 'import { createNativeDocumentSigningCopy } from "@/lib/document-signing-copy.functions";\nimport { toast } from "sonner";\n'),
            ('''function alignStyle(align?: NativeDocumentAlignment) {\n  return align && align !== "left" ? ` style="text-align:${align}"` : "";\n}\n''', '''function blockAttributes(align?: NativeDocumentAlignment, indent?: number) {\n  const styles: string[] = [];\n  if (align && align !== "left") styles.push(`text-align:${align}`);\n  if (indent && indent > 0) styles.push(`margin-left:${indent * 36}px`);\n  const indentAttribute = indent && indent > 0 ? ` data-indent="${indent}"` : "";\n  const styleAttribute = styles.length > 0 ? ` style="${styles.join(";")}"` : "";\n  return `${indentAttribute}${styleAttribute}`;\n}\n'''),
            ('return `<${tag} data-block-id="${escapeHtml(block.id)}">${block.items', 'return `<${tag} data-block-id="${escapeHtml(block.id)}"${blockAttributes(undefined, block.indent)}>${block.items'),
            ('''    const id = node.dataset.blockId || blockId();\n    const tag = node.tagName;\n''', '''    const id = node.dataset.blockId || blockId();\n    node.dataset.blockId = id;\n    const tag = node.tagName;\n    const indent = elementIndent(node);\n'''),
            ('  const savingRef = useRef(false);\n', '  const savingRef = useRef(false);\n  const hydratedDocumentIdRef = useRef<string | null>(null);\n'),
            ('  const [exporting, setExporting] = useState(false);\n', '  const [exporting, setExporting] = useState(false);\n  const [creatingSigningCopy, setCreatingSigningCopy] = useState(false);\n'),
            ('  const letterheadFn = useServerFn(setDocumentLetterhead);\n', '  const letterheadFn = useServerFn(setDocumentLetterhead);\n  const signingCopyFn = useServerFn(createNativeDocumentSigningCopy);\n'),
            ('''  const handleExport = async (print = false) => {\n    setExporting(true);\n    try {\n      syncFromEditor();\n      const saved = saveState === "saved" ? true : Boolean(await persist());\n      if (!saved && saveState === "conflict") return;\n      const result = await exportFn({ data: { documentId: document.id } });\n''', '''  const handleExport = async (print = false) => {\n    setExporting(true);\n    try {\n      syncFromEditor();\n      const saved = Boolean(await persist());\n      if (!saved) return;\n      const result = await exportFn({ data: { documentId: document.id } });\n'''),
            ('''          <ToolbarButton label="Decrease indent" onPress={() => exec("outdent")}>\n            <IndentDecrease className="h-4 w-4" />\n          </ToolbarButton>\n          <ToolbarButton label="Increase indent" onPress={() => exec("indent")}>\n            <IndentIncrease className="h-4 w-4" />\n          </ToolbarButton>\n''', '''          <ToolbarButton label="Decrease indent" onPress={() => adjustIndent(-1)}>\n            <IndentDecrease className="h-4 w-4" />\n          </ToolbarButton>\n          <ToolbarButton label="Increase indent" onPress={() => adjustIndent(1)}>\n            <IndentIncrease className="h-4 w-4" />\n          </ToolbarButton>\n'''),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f"missing expected editor fragment: {old[:70]!r}")
            s = s.replace(old, new, 1)

          s = s.replace("${alignStyle(block.align)}", "${blockAttributes(block.align, block.indent)}")

          alignment = '''function elementAlignment(element: HTMLElement): NativeDocumentAlignment | undefined {\n  const align = element.style.textAlign;\n  return align === "center" || align === "right" || align === "justify" ? align : undefined;\n}\n'''
          if alignment not in s:
            raise SystemExit("missing alignment helper")
          s = s.replace(alignment, alignment + '''\nfunction elementIndent(element: HTMLElement): number | undefined {\n  const explicit = Number(element.dataset.indent);\n  if (Number.isFinite(explicit) && explicit > 0) return Math.min(8, Math.round(explicit));\n  const margin = Number.parseFloat(element.style.marginLeft);\n  if (!Number.isFinite(margin) || margin <= 0) return undefined;\n  return Math.min(8, Math.max(1, Math.round(margin / 36)));\n}\n''', 1)

          aligned = "        align: elementAlignment(node),\n"
          if s.count(aligned) < 3:
            raise SystemExit("expected aligned heading/quote/paragraph serializers")
          s = s.replace(aligned, aligned + "        indent,\n")

          list_tail = '''        items: Array.from(node.querySelectorAll(":scope > li")).map((item) =>\n          sanitizeInlineHtml(item.innerHTML),\n        ),\n'''
          if list_tail not in s:
            raise SystemExit("missing list serializer")
          s = s.replace(list_tail, list_tail + "        indent,\n", 1)

          old_effect = '''  useEffect(() => {\n    const next = normalizeNativeDocumentContent(document.content);\n    applyContentToEditor(next);\n    setTitle(document.title);\n    setEditorVersion(document.editor_version);\n    latestEditorVersionRef.current = document.editor_version;\n    setSaveState("saved");\n    setLastSavedAt(new Date(document.updated_at));\n  }, [\n    document.id,\n    document.content,\n    document.editor_version,\n    document.title,\n    applyContentToEditor,\n  ]);\n'''
          new_effect = '''  useEffect(() => {\n    setTitle(document.title);\n    const isInitialDocument = hydratedDocumentIdRef.current !== document.id;\n    const incomingVersionIsNewer = document.editor_version > latestEditorVersionRef.current;\n    if (!isInitialDocument && (!incomingVersionIsNewer || saveState !== "saved")) return;\n\n    const next = normalizeNativeDocumentContent(document.content);\n    applyContentToEditor(next);\n    hydratedDocumentIdRef.current = document.id;\n    setEditorVersion(document.editor_version);\n    latestEditorVersionRef.current = document.editor_version;\n    setSaveState("saved");\n    setLastSavedAt(new Date(document.updated_at));\n  }, [\n    document.id,\n    document.content,\n    document.editor_version,\n    document.title,\n    document.updated_at,\n    applyContentToEditor,\n    saveState,\n  ]);\n'''
          if old_effect not in s:
            raise SystemExit("missing hydration effect")
          s = s.replace(old_effect, new_effect, 1)

          insert_marker = '  const insertHtml = (html: string) => exec("insertHTML", html);\n\n'
          indent_fn = '''  const adjustIndent = (delta: number) => {\n    const root = editorRef.current;\n    const selection = window.getSelection();\n    if (!root || !selection?.rangeCount) return;\n    const container = selection.getRangeAt(0).commonAncestorContainer;\n    let element = container instanceof HTMLElement ? container : container.parentElement;\n    while (element && element.parentElement !== root) element = element.parentElement;\n    if (!element || !root.contains(element)) return;\n    const current = elementIndent(element) ?? 0;\n    const next = Math.max(0, Math.min(8, current + delta));\n    if (next > 0) {\n      element.dataset.indent = String(next);\n      element.style.marginLeft = `${next * 36}px`;\n    } else {\n      delete element.dataset.indent;\n      element.style.marginLeft = "";\n    }\n    syncFromEditor();\n  };\n\n'''
          if insert_marker not in s:
            raise SystemExit("missing insertHtml marker")
          s = s.replace(insert_marker, insert_marker + indent_fn, 1)

          restore_marker = '  const restoreVersion = async (versionId: string) => {\n'
          signing_handler = '''  const handleCreateSigningCopy = async () => {\n    setCreatingSigningCopy(true);\n    try {\n      syncFromEditor();\n      const saved = Boolean(await persist());\n      if (!saved) return;\n      const result = await signingCopyFn({ data: { documentId: document.id } });\n      window.open(`/dashboard/documents/${result.document.id}`, "_blank", "noopener,noreferrer");\n      toast.success("Immutable PDF signing copy created");\n    } catch (error) {\n      toastError(error, "Signing copy creation failed");\n    } finally {\n      setCreatingSigningCopy(false);\n    }\n  };\n\n'''
          if restore_marker not in s:
            raise SystemExit("missing restore marker")
          s = s.replace(restore_marker, signing_handler + restore_marker, 1)

          old_menu = '''              <DropdownMenuItem onClick={() => void handleExport(false)}>\n                <FileDown className="mr-2 h-4 w-4" /> Export PDF\n              </DropdownMenuItem>\n              <DropdownMenuItem onClick={() => void handleExport(true)}>\n                <Printer className="mr-2 h-4 w-4" /> Print\n              </DropdownMenuItem>\n'''
          new_menu = '''              <DropdownMenuItem\n                disabled={exporting || saveState === "saving" || saveState === "conflict"}\n                onClick={() => void handleExport(false)}\n              >\n                <FileDown className="mr-2 h-4 w-4" /> Export PDF\n              </DropdownMenuItem>\n              <DropdownMenuItem\n                disabled={exporting || saveState === "saving" || saveState === "conflict"}\n                onClick={() => void handleExport(true)}\n              >\n                <Printer className="mr-2 h-4 w-4" /> Print\n              </DropdownMenuItem>\n              <DropdownMenuItem\n                disabled={creatingSigningCopy || exporting || saveState === "saving" || saveState === "conflict"}\n                onClick={() => void handleCreateSigningCopy()}\n              >\n                <FileSignature className="mr-2 h-4 w-4" /> Create signing copy\n              </DropdownMenuItem>\n'''
          if old_menu not in s:
            raise SystemExit("missing file export menu")
          s = s.replace(old_menu, new_menu, 1)
          p.write_text(s)

          d = Path("src/lib/documents.functions.ts")
          t = d.read_text()
          old_select = '.select("id,workspace_id,title,document_kind,content,letterhead_id")'
          if old_select not in t:
            raise SystemExit("missing PDF source select")
          t = t.replace(old_select, '.select("id,workspace_id,title,document_kind,content,letterhead_id,updated_at")', 1)
          old_render = '''      logoBytes,\n      logoMimeType,\n    });\n\n    const storagePath = `${workspaceId}/${userId}/documents/${document.id}/export-${Date.now()}.pdf`;\n'''
          if old_render not in t:
            raise SystemExit("missing renderer call")
          t = t.replace(old_render, '''      logoBytes,\n      logoMimeType,\n      renderedAt: document.updated_at,\n    });\n\n    const storagePath = `${workspaceId}/${userId}/documents/${document.id}/export-${Date.now()}.pdf`;\n''', 1)
          d.write_text(t)
          PY
      - run: bunx prettier --write src/components/document/native-document-editor.tsx src/lib/documents.functions.ts
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/document/native-document-editor.tsx src/lib/documents.functions.ts
          git commit -m "feat(phase2): harden native editor persistence and exports"
          git push origin HEAD:phase-0-canonical-reconciliation
