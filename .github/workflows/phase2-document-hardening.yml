name: Phase 2 Document Hardening

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/phase2-document-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Apply guarded Phase 2 editor fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          editor_path = Path("src/components/document/native-document-editor.tsx")
          text = editor_path.read_text()

          text = replace_once(text, "  FileDown,\n  Heading1,", "  FileDown,\n  FileSignature,\n  Heading1,", "FileSignature import")
          text = replace_once(
              text,
              'import { toast } from "sonner";\n',
              'import { createNativeDocumentSigningCopy } from "@/lib/document-signing-copy.functions";\nimport { toast } from "sonner";\n',
              "signing copy import",
          )

          old_style = '''function alignStyle(align?: NativeDocumentAlignment) {\n  return align && align !== "left" ? ` style="text-align:${align}"` : "";\n}\n'''
          new_style = '''function blockAttributes(align?: NativeDocumentAlignment, indent?: number) {\n  const styles: string[] = [];\n  if (align && align !== "left") styles.push(`text-align:${align}`);\n  if (indent && indent > 0) styles.push(`margin-left:${indent * 36}px`);\n  const indentAttribute = indent && indent > 0 ? ` data-indent="${indent}"` : "";\n  const styleAttribute = styles.length > 0 ? ` style="${styles.join(";")}"` : "";\n  return `${indentAttribute}${styleAttribute}`;\n}\n'''
          text = replace_once(text, old_style, new_style, "block style")
          text = text.replace("${alignStyle(block.align)}", "${blockAttributes(block.align, block.indent)}")
          text = replace_once(
              text,
              'return `<${tag} data-block-id="${escapeHtml(block.id)}">${block.items',
              'return `<${tag} data-block-id="${escapeHtml(block.id)}"${blockAttributes(undefined, block.indent)}>${block.items',
              "list attributes",
          )

          alignment = '''function elementAlignment(element: HTMLElement): NativeDocumentAlignment | undefined {\n  const align = element.style.textAlign;\n  return align === "center" || align === "right" || align === "justify" ? align : undefined;\n}\n'''
          indentation = alignment + '''\nfunction elementIndent(element: HTMLElement): number | undefined {\n  const explicit = Number(element.dataset.indent);\n  if (Number.isFinite(explicit) && explicit > 0) return Math.min(8, Math.round(explicit));\n  const margin = Number.parseFloat(element.style.marginLeft);\n  if (!Number.isFinite(margin) || margin <= 0) return undefined;\n  return Math.min(8, Math.max(1, Math.round(margin / 36)));\n}\n'''
          text = replace_once(text, alignment, indentation, "element indent helper")
          text = replace_once(
              text,
              '''    const id = node.dataset.blockId || blockId();\n    const tag = node.tagName;\n''',
              '''    const id = node.dataset.blockId || blockId();\n    node.dataset.blockId = id;\n    const tag = node.tagName;\n    const indent = elementIndent(node);\n''',
              "stable block id",
          )
          text = text.replace("        align: elementAlignment(node),\n", "        align: elementAlignment(node),\n        indent,\n")
          text = replace_once(
              text,
              '''        items: Array.from(node.querySelectorAll(":scope > li")).map((item) =>\n          sanitizeInlineHtml(item.innerHTML),\n        ),\n''',
              '''        items: Array.from(node.querySelectorAll(":scope > li")).map((item) =>\n          sanitizeInlineHtml(item.innerHTML),\n        ),\n        indent,\n''',
              "list indent serialization",
          )
          text = replace_once(
              text,
              '''      html: sanitizeInlineHtml(node.innerHTML),\n      align: elementAlignment(node),\n    });\n''',
              '''      html: sanitizeInlineHtml(node.innerHTML),\n      align: elementAlignment(node),\n      indent,\n    });\n''',
              "paragraph indent serialization",
          )

          text = replace_once(
              text,
              '  const savingRef = useRef(false);\n',
              '  const savingRef = useRef(false);\n  const hydratedDocumentIdRef = useRef<string | null>(null);\n',
              "hydration ref",
          )
          text = replace_once(
              text,
              '  const [exporting, setExporting] = useState(false);\n',
              '  const [exporting, setExporting] = useState(false);\n  const [creatingSigningCopy, setCreatingSigningCopy] = useState(false);\n',
              "signing copy state",
          )
          text = replace_once(
              text,
              '  const letterheadFn = useServerFn(setDocumentLetterhead);\n',
              '  const letterheadFn = useServerFn(setDocumentLetterhead);\n  const signingCopyFn = useServerFn(createNativeDocumentSigningCopy);\n',
              "signing copy server fn",
          )

          old_effect = '''  useEffect(() => {\n    const next = normalizeNativeDocumentContent(document.content);\n    applyContentToEditor(next);\n    setTitle(document.title);\n    setEditorVersion(document.editor_version);\n    latestEditorVersionRef.current = document.editor_version;\n    setSaveState("saved");\n    setLastSavedAt(new Date(document.updated_at));\n  }, [\n    document.id,\n    document.content,\n    document.editor_version,\n    document.title,\n    applyContentToEditor,\n  ]);\n'''
          new_effect = '''  useEffect(() => {\n    setTitle(document.title);\n    const isInitialDocument = hydratedDocumentIdRef.current !== document.id;\n    const incomingVersionIsNewer = document.editor_version > latestEditorVersionRef.current;\n    if (!isInitialDocument && (!incomingVersionIsNewer || saveState !== "saved")) return;\n\n    const next = normalizeNativeDocumentContent(document.content);\n    applyContentToEditor(next);\n    hydratedDocumentIdRef.current = document.id;\n    setEditorVersion(document.editor_version);\n    latestEditorVersionRef.current = document.editor_version;\n    setSaveState("saved");\n    setLastSavedAt(new Date(document.updated_at));\n  }, [\n    document.id,\n    document.content,\n    document.editor_version,\n    document.title,\n    document.updated_at,\n    applyContentToEditor,\n    saveState,\n  ]);\n'''
          text = replace_once(text, old_effect, new_effect, "hydration effect")

          text = replace_once(
              text,
              '''  const insertHtml = (html: string) => exec("insertHTML", html);\n\n  const updatePage''',
              '''  const insertHtml = (html: string) => exec("insertHTML", html);\n\n  const adjustIndent = (delta: number) => {\n    const root = editorRef.current;\n    const selection = window.getSelection();\n    if (!root || !selection?.rangeCount) return;\n    let element =\n      selection.getRangeAt(0).commonAncestorContainer instanceof HTMLElement\n        ? selection.getRangeAt(0).commonAncestorContainer\n        : selection.getRangeAt(0).commonAncestorContainer.parentElement;\n    while (element && element.parentElement !== root) element = element.parentElement;\n    if (!element || !root.contains(element)) return;\n\n    const current = elementIndent(element) ?? 0;\n    const next = Math.max(0, Math.min(8, current + delta));\n    if (next > 0) {\n      element.dataset.indent = String(next);\n      element.style.marginLeft = `${next * 36}px`;\n    } else {\n      delete element.dataset.indent;\n      element.style.marginLeft = "";\n    }\n    syncFromEditor();\n  };\n\n  const updatePage''',
              "indent command",
          )

          old_export = '''  const handleExport = async (print = false) => {\n    setExporting(true);\n    try {\n      syncFromEditor();\n      const saved = saveState === "saved" ? true : Boolean(await persist());\n      if (!saved && saveState === "conflict") return;\n      const result = await exportFn({ data: { documentId: document.id } });\n'''
          new_export = '''  const handleExport = async (print = false) => {\n    setExporting(true);\n    try {\n      syncFromEditor();\n      const saved = Boolean(await persist());\n      if (!saved) return;\n      const result = await exportFn({ data: { documentId: document.id } });\n'''
          text = replace_once(text, old_export, new_export, "export save barrier")

          marker = '''  const restoreVersion = async (versionId: string) => {\n'''
          signing_handler = '''  const handleCreateSigningCopy = async () => {\n    setCreatingSigningCopy(true);\n    try {\n      syncFromEditor();\n      const saved = Boolean(await persist());\n      if (!saved) return;\n      const result = await signingCopyFn({ data: { documentId: document.id } });\n      window.open(\n        `/dashboard/documents/${result.document.id}`,\n        "_blank",\n        "noopener,noreferrer",\n      );\n      toast.success("Immutable PDF signing copy created");\n    } catch (error) {\n      toastError(error, "Signing copy creation failed");\n    } finally {\n      setCreatingSigningCopy(false);\n    }\n  };\n\n'''
          text = replace_once(text, marker, signing_handler + marker, "signing copy handler")

          text = replace_once(
              text,
              '''              <DropdownMenuItem onClick={() => void handleExport(false)}>\n                <FileDown className="mr-2 h-4 w-4" /> Export PDF\n              </DropdownMenuItem>\n              <DropdownMenuItem onClick={() => void handleExport(true)}>\n                <Printer className="mr-2 h-4 w-4" /> Print\n              </DropdownMenuItem>\n''',
              '''              <DropdownMenuItem\n                disabled={exporting || saveState === "saving" || saveState === "conflict"}\n                onClick={() => void handleExport(false)}\n              >\n                <FileDown className="mr-2 h-4 w-4" /> Export PDF\n              </DropdownMenuItem>\n              <DropdownMenuItem\n                disabled={exporting || saveState === "saving" || saveState === "conflict"}\n                onClick={() => void handleExport(true)}\n              >\n                <Printer className="mr-2 h-4 w-4" /> Print\n              </DropdownMenuItem>\n              <DropdownMenuItem\n                disabled={\n                  creatingSigningCopy || exporting || saveState === "saving" || saveState === "conflict"\n                }\n                onClick={() => void handleCreateSigningCopy()}\n              >\n                <FileSignature className="mr-2 h-4 w-4" /> Create signing copy\n              </DropdownMenuItem>\n''',
              "file menu actions",
          )
          text = replace_once(
              text,
              '''          <ToolbarButton label="Decrease indent" onPress={() => exec("outdent")}>\n            <IndentDecrease className="h-4 w-4" />\n          </ToolbarButton>\n          <ToolbarButton label="Increase indent" onPress={() => exec("indent")}>\n            <IndentIncrease className="h-4 w-4" />\n          </ToolbarButton>\n''',
              '''          <ToolbarButton label="Decrease indent" onPress={() => adjustIndent(-1)}>\n            <IndentDecrease className="h-4 w-4" />\n          </ToolbarButton>\n          <ToolbarButton label="Increase indent" onPress={() => adjustIndent(1)}>\n            <IndentIncrease className="h-4 w-4" />\n          </ToolbarButton>\n''',
              "indent toolbar",
          )

          editor_path.write_text(text)

          docs_path = Path("src/lib/documents.functions.ts")
          docs = docs_path.read_text()
          docs = replace_once(
              docs,
              '.select("id,workspace_id,title,document_kind,content,letterhead_id")',
              '.select("id,workspace_id,title,document_kind,content,letterhead_id,updated_at")',
              "export source timestamp select",
          )
          docs = replace_once(
              docs,
              '''      logoBytes,\n      logoMimeType,\n    });\n\n    const storagePath = `${workspaceId}/${userId}/documents/${document.id}/export-${Date.now()}.pdf`;\n''',
              '''      logoBytes,\n      logoMimeType,\n      renderedAt: document.updated_at,\n    });\n\n    const storagePath = `${workspaceId}/${userId}/documents/${document.id}/export-${Date.now()}.pdf`;\n''',
              "deterministic export metadata",
          )
          docs_path.write_text(docs)
          PY

      - name: Format changed source
        run: bunx prettier --write src/components/document/native-document-editor.tsx src/lib/documents.functions.ts src/lib/document-signing-copy.functions.ts src/lib/native-document.ts src/lib/native-document-pdf.server.ts src/lib/native-document.test.ts src/lib/native-document-pdf.server.test.ts

      - name: Verify lint
        run: bun run lint

      - name: Verify TypeScript
        run: bun run typecheck

      - name: Verify tests
        run: bun run test

      - name: Verify production build
        run: bun run build

      - name: Commit Phase 2 document hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/document/native-document-editor.tsx src/lib/documents.functions.ts src/lib/document-signing-copy.functions.ts src/lib/native-document.ts src/lib/native-document-pdf.server.ts src/lib/native-document.test.ts src/lib/native-document-pdf.server.test.ts
          if git diff --cached --quiet; then
            echo "No Phase 2 hardening changes required."
          else
            git commit -m "feat(phase2): harden editor export and signing-copy flow"
            git push origin HEAD:phase-0-canonical-reconciliation
          fi
