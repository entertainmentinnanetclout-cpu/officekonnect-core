name: Phase 2 Renderer Type Fix
on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths: [.github/workflows/phase2-editor-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Narrow paragraph block explicitly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/native-document-pdf.server.ts')
          s=p.read_text()
          old='''  return drawTextBlock(state, htmlToPlainText(block.html), {\n    size: 10.5,\n    lineHeight: 14.5,\n    after: 6,\n  });\n}'''
          new='''  if (block.type === "paragraph") {\n    return drawTextBlock(state, htmlToPlainText(block.html), {\n      size: 10.5,\n      lineHeight: 14.5,\n      after: 6,\n    });\n  }\n\n  return state;\n}'''
          if old not in s:
            raise SystemExit('Expected PDF paragraph branch not found')
          p.write_text(s.replace(old,new,1))
          PY
          bunx prettier --write src/lib/native-document-pdf.server.ts
          bunx eslint src/lib/native-document-pdf.server.ts
          bun run typecheck
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/native-document-pdf.server.ts
          git commit -m "fix(phase2): narrow PDF paragraph rendering"
          git push origin HEAD:phase-0-canonical-reconciliation
