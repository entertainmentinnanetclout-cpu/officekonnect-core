name: Phase 2 Source Normalize
on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths: [.github/workflows/phase2-editor-fix.yml]
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Correct Phase 2 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/document/uploaded-document-workspace.tsx')
          s=p.read_text()
          s=s.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useMemo, useState, type MouseEvent } from "react";')
          s=s.replace('onClick={(event: React.MouseEvent) => event.stopPropagation()}', 'onClick={(event: MouseEvent) => event.stopPropagation()}')
          p.write_text(s)
          p=Path('src/routes/dashboard/documents/index.tsx')
          s=p.read_text().replace('  ArrowDownAZ,\n', '')
          s=s.replace('\n      <span className="sr-only"><ArrowDownAZ /> Documents are sorted using the selected sort control.</span>', '')
          p.write_text(s)
          PY
      - name: Format and autofix
        run: |
          FILES=(
            src/lib/native-document.ts
            src/lib/native-document-pdf.server.ts
            src/lib/documents.functions.ts
            src/lib/download.ts
            src/components/document/native-document-editor.tsx
            src/components/document/uploaded-document-workspace.tsx
            'src/routes/dashboard/documents/$documentId.tsx'
            src/routes/dashboard/documents/index.tsx
          )
          bunx prettier --write "${FILES[@]}"
          bunx eslint "${FILES[@]}" --fix
      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/native-document.ts src/lib/native-document-pdf.server.ts src/lib/documents.functions.ts src/lib/download.ts src/components/document/native-document-editor.tsx src/components/document/uploaded-document-workspace.tsx 'src/routes/dashboard/documents/$documentId.tsx' src/routes/dashboard/documents/index.tsx
          if git diff --cached --quiet; then
            echo "No normalization changes required."
          else
            git commit -m "style(phase2): normalize document workspace source"
            git push origin HEAD:phase-0-canonical-reconciliation
          fi
