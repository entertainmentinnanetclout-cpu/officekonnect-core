name: Phase 8 Route Tree Sync

on:
  push:
    branches:
      - phase-0-canonical-reconciliation
    paths:
      - 'src/routes/dashboard/notifications/**'
      - 'src/routes/dashboard/activity/**'
      - 'src/routes/dashboard/team/**'
      - 'src/routes/dashboard/workspace/**'
      - 'src/routes/invite/**'
      - '.github/workflows/phase8-route-tree-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Generate TanStack route tree
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-public-key
        run: bun run build
      - name: Commit generated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo 'Route tree already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git commit -m 'chore(phase8): regenerate TanStack route tree'
          git push
