name: Phase 8 Scoped Format

on:
  push:
    branches:
      - phase-0-canonical-reconciliation
    paths:
      - '.github/workflows/phase8-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Format only Phase 8 touched source
        run: |
          bunx prettier --write \
            src/components/notifications/notification-bell.tsx \
            src/components/officekonnect-shell.tsx \
            src/lib/phase8.functions.ts \
            src/lib/notifications.functions.ts \
            src/routes/__root.tsx \
            src/routes/dashboard/activity/index.tsx \
            src/routes/dashboard/notifications/index.tsx \
            src/routes/dashboard/settings/index.tsx \
            src/routes/dashboard/team/index.tsx \
            src/routes/dashboard/workspace/index.tsx \
            'src/routes/invite/$token.tsx'
          bunx eslint --fix \
            src/components/notifications/notification-bell.tsx \
            src/components/officekonnect-shell.tsx \
            src/lib/phase8.functions.ts \
            src/lib/notifications.functions.ts \
            src/routes/__root.tsx \
            src/routes/dashboard/activity/index.tsx \
            src/routes/dashboard/notifications/index.tsx \
            src/routes/dashboard/settings/index.tsx \
            src/routes/dashboard/team/index.tsx \
            src/routes/dashboard/workspace/index.tsx \
            'src/routes/invite/$token.tsx'
      - name: Commit scoped formatting
        run: |
          if git diff --quiet; then
            echo 'Nothing to format.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/notifications/notification-bell.tsx \
            src/components/officekonnect-shell.tsx \
            src/lib/phase8.functions.ts \
            src/lib/notifications.functions.ts \
            src/routes/__root.tsx \
            src/routes/dashboard/activity/index.tsx \
            src/routes/dashboard/notifications/index.tsx \
            src/routes/dashboard/settings/index.tsx \
            src/routes/dashboard/team/index.tsx \
            src/routes/dashboard/workspace/index.tsx \
            'src/routes/invite/$token.tsx'
          git commit -m 'style(phase8): format operational surfaces'
          git push
