name: Phase 10 Tooling Reconciliation

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths: [.github/workflows/phase10-tooling-one-shot.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Add Playwright test runner
        run: bun add --dev @playwright/test@latest
      - name: Reconcile scripts, finalizer and permanent CI
        shell: python
        run: |
          from pathlib import Path
          import json

          package = Path("package.json")
          data = json.loads(package.read_text())
          scripts = data.setdefault("scripts", {})
          scripts["audit:product"] = "node scripts/check-product-hardening.mjs"
          scripts["audit:security"] = "node scripts/check-security-boundaries.mjs"
          scripts["audit:performance"] = "node scripts/check-build-budget.mjs"
          scripts["test:e2e"] = "playwright test"
          scripts["check"] = "bun run phase0:parity && bun run lint && bun run audit:product && bun run audit:security && bun run typecheck && bun run test && bun run build && bun run audit:performance"
          package.write_text(json.dumps(data, indent=2) + "\n")

          finalizer = Path("supabase/functions/signing-finalize/index.ts")
          text = finalizer.read_text()
          text = text.replace(
              'import { PDFDocument, StandardFonts, degrees, rgb } from "pdf-lib";',
              'import { PDFDocument, StandardFonts, rgb } from "pdf-lib";\nimport { applySigningFieldsToPdf } from "../_shared/signing-pdf.ts";',
          )
          start = '    const pdf = await PDFDocument.load(sourceBytes, { ignoreEncryption: false });\n'
          end = '    const finalHash = await sha256Hex(finalBytes);\n'
          start_index = text.find(start)
          end_index = text.find(end, start_index)
          if start_index < 0 or end_index < 0:
              raise SystemExit("Signing finalizer render block markers not found")
          replacement = '''    const finalBytes = await applySigningFieldsToPdf(\n      sourceBytes,\n      finalizationPayload.fields ?? [],\n      (storagePath) => downloadFromBuckets(service, storagePath, ["signatures"]),\n    );\n'''
          text = text[:start_index] + replacement + text[end_index:]
          finalizer.write_text(text)

          workflow = Path(".github/workflows/phase0-deterministic-validation.yml")
          workflow.write_text('''name: Upgrade Validation\n\non:\n  pull_request:\n    branches: [main]\n  push:\n    branches: [phase-0-canonical-reconciliation]\n\npermissions:\n  contents: read\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    env:\n      SUPABASE_URL: https://ci-placeholder.supabase.co\n      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key\n      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co\n      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v5\n      - name: Setup Bun\n        uses: oven-sh/setup-bun@v2\n        with:\n          bun-version: 1.3.14\n      - name: Repository parity\n        run: bun run phase0:parity\n      - name: Install dependencies\n        run: bun ci\n      - name: Lint\n        run: bun run lint\n      - name: Product hardening audit\n        run: bun run audit:product\n      - name: Security boundary audit\n        run: bun run audit:security\n      - name: TypeScript\n        run: bun run typecheck\n      - name: Unit and integration tests\n        run: bun run test\n      - name: Production build\n        run: bun run build\n      - name: Production asset budget\n        run: bun run audit:performance\n      - name: Install Playwright Chromium\n        run: bunx playwright install --with-deps chromium\n      - name: Browser E2E\n        run: bun run test:e2e\n''')
      - name: Format changed source
        run: bunx prettier --write package.json playwright.config.ts e2e/public-routes.spec.ts tests/signing-finalization-pdf.integration.test.ts scripts/check-security-boundaries.mjs scripts/check-build-budget.mjs supabase/functions/_shared/signing-pdf.ts supabase/functions/signing-finalize/index.ts .github/workflows/phase0-deterministic-validation.yml
      - name: Commit reconciliation
        run: |
          git config user.name "officekonnect-phase10-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json bun.lock playwright.config.ts e2e tests scripts supabase/functions .github/workflows/phase0-deterministic-validation.yml
          git commit -m "feat(phase10): add security performance PDF and browser CI gates"
          git push origin HEAD:phase-0-canonical-reconciliation
