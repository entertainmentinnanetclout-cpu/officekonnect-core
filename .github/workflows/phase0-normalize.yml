name: Upgrade Normalize Repository

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/phase0-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild deterministic npm lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format upgrade lint blockers
        run: >-
          npx prettier --write
          scripts/check-phase0-parity.mjs
          src/components/brevo-onboarding.tsx
          src/components/document/send-document-dialog.tsx
          src/components/document/pdf-workspace.tsx
          src/components/officekonnect-shell.tsx
          src/hooks/use-workspace-shell.ts
          src/lib/development-session.functions.ts
          src/lib/documents.functions.ts
          src/lib/signing.functions.ts
          src/routes/dashboard.tsx

      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json scripts/check-phase0-parity.mjs src/components/brevo-onboarding.tsx src/components/document/send-document-dialog.tsx src/components/document/pdf-workspace.tsx src/components/officekonnect-shell.tsx src/hooks/use-workspace-shell.ts src/lib/development-session.functions.ts src/lib/documents.functions.ts src/lib/signing.functions.ts src/routes/dashboard.tsx
          if git diff --cached --quiet; then
            echo "No normalization changes required."
          else
            git commit -m "chore: normalize upgrade sources and lock dependencies"
            git push origin HEAD:phase-0-canonical-reconciliation
          fi
