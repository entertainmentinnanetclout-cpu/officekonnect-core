name: Upgrade Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-0-canonical-reconciliation]

permissions:
  contents: write

jobs:
  phase67-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Reconcile Phase 6 and 7 source
        run: python3 scripts/phase67-finalize.py

      - name: Format changed product source
        run: >-
          bunx prettier --write
          src/routes/__root.tsx
          src/components/officekonnect-shell.tsx
          src/components/search/global-search-dialog.tsx
          src/components/signing/signing-pdf-fields.tsx
          src/components/document/native-document-editor.tsx
          src/components/spreadsheet/spreadsheet-editor.tsx
          src/routes/dashboard/signing/index.tsx
          'src/routes/dashboard/signing/$requestId/prepare.tsx'
          'src/routes/dashboard/signing/$requestId/index.tsx'
          'src/routes/sign/$token.tsx'
          src/routes/sign/active.tsx
          src/routes/dashboard/tasks/index.tsx
          src/routes/dashboard/calendar/index.tsx
          src/routes/dashboard/search/index.tsx
          src/lib/signing.ts
          src/lib/signing.functions.ts
          src/lib/external-signing.ts
          src/lib/tasks.functions.ts
          src/lib/calendar.functions.ts
          src/lib/search.functions.ts
          src/lib/signing.test.ts
          src/lib/phase7-contract.test.ts
          src/integrations/supabase/types.ts

      - name: Generate typed route tree
        run: bun run build

      - name: Lint reconciled source
        run: bun run lint

      - name: TypeScript reconciled source
        run: bun run typecheck

      - name: Tests reconciled source
        run: bun run test

      - name: Production build reconciled source
        run: bun run build

      - name: Commit validated Phase 6 and 7 reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts src/routes/__root.tsx src/components/officekonnect-shell.tsx src/components/document/native-document-editor.tsx src/components/spreadsheet/spreadsheet-editor.tsx src/routes/dashboard/signing/index.tsx 'src/routes/dashboard/signing/$requestId/prepare.tsx' src/routes/dashboard/calendar/index.tsx src/integrations/supabase/types.ts
          git commit -m "feat(phase67): activate full signing tasks calendar and search integration"
          git fetch origin phase-0-canonical-reconciliation
          git rebase origin/phase-0-canonical-reconciliation
          git push origin HEAD:phase-0-canonical-reconciliation

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Repository parity
        run: bun run phase0:parity
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: TypeScript
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
