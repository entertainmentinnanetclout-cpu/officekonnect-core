name: Phase 2 Apply Editor Hardening

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/phase2-editor-apply.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - name: Record editor patch guard counts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("src/components/document/native-document-editor.tsx").read_text()
          d = Path("src/lib/documents.functions.ts").read_text()
          checks = {
            "icon": "  FileDown,\n  Heading1,",
            "toast_import": 'import { toast } from "sonner";\n',
            "align_helper": 'function alignStyle(align?: NativeDocumentAlignment) {\n',
            "list_html": 'return `<${tag} data-block-id="${escapeHtml(block.id)}">${block.items',
            "id_tag": '    const id = node.dataset.blockId || blockId();\n    const tag = node.tagName;\n',
            "saving_ref": '  const savingRef = useRef(false);\n',
            "export_state": '  const [exporting, setExporting] = useState(false);\n',
            "letterhead_fn": '  const letterheadFn = useServerFn(setDocumentLetterhead);\n',
            "align_serializers": '        align: elementAlignment(node),\n',
            "list_serializer": '        items: Array.from(node.querySelectorAll(":scope > li")).map((item) =>\n',
            "hydrate_effect": '  useEffect(() => {\n    const next = normalizeNativeDocumentContent(document.content);\n',
            "insert_html": '  const insertHtml = (html: string) => exec("insertHTML", html);\n',
            "restore": '  const restoreVersion = async (versionId: string) => {\n',
            "old_export_barrier": '      const saved = saveState === "saved" ? true : Boolean(await persist());\n',
            "old_outdent": '<ToolbarButton label="Decrease indent" onPress={() => exec("outdent")}>',
            "old_export_menu": '<DropdownMenuItem onClick={() => void handleExport(false)}>',
          }
          lines = [f"{name}={s.count(fragment)}" for name, fragment in checks.items()]
          lines += [
            f"doc_select={d.count('.select(\"id,workspace_id,title,document_kind,content,letterhead_id\")')}",
            f"doc_render_marker={d.count('      logoMimeType,\\n    });\\n\\n    const storagePath = `${workspaceId}/${userId}/documents/${{document.id}}/export-${{Date.now()}}.pdf`;\\n')}",
          ]
          Path(".phase2-editor-diagnostic.txt").write_text("\n".join(lines) + "\n")
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .phase2-editor-diagnostic.txt
          git commit -m "chore(phase2): record editor patch diagnostics"
          git push origin HEAD:phase-0-canonical-reconciliation
