name: Upgrade Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-0-canonical-reconciliation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Repository parity
        run: bun run phase0:parity

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Production build
        run: bun run build
