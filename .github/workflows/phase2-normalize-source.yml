name: Phase 2 Normalize Source

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/phase2-normalize-source.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Remove renderer control-regex lint violation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/lib/native-document-pdf.server.ts")
          text = path.read_text()
          old = r'''.replace(/[^\x09\x0a\x0d\x20-\x7e\xa0-\xff]/g, "?");'''
          new = r'''.replace(/[^\x20-\x7e\xa0-\xff]/g, (character) =>
              character === "\n" || character === "\r" || character === "\t" ? character : "?",
            );'''
          if old not in text:
              raise SystemExit("expected renderer normalization expression not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format Phase 2 source
        run: bunx prettier --write src/lib/native-document.ts src/lib/native-document-pdf.server.ts src/lib/document-signing-copy.functions.ts src/lib/native-document.test.ts src/lib/native-document-pdf.server.test.ts
      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/native-document.ts src/lib/native-document-pdf.server.ts src/lib/document-signing-copy.functions.ts src/lib/native-document.test.ts src/lib/native-document-pdf.server.test.ts
          git commit -m "style(phase2): normalize document renderer source"
          git push origin HEAD:phase-0-canonical-reconciliation
