name: Upgrade Semantic Lint Fix

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/upgrade-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Apply guarded type fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "src/routes/dashboard/documents/index.tsx",
              '    onError: (error: any) => {\n      toast.error(`Upload failed: ${error.message}`);',
              '    onError: (error: unknown) => {\n      const message = error instanceof Error ? error.message : "Unknown upload error";\n      toast.error(`Upload failed: ${message}`);',
          )

          replace(
              "src/routes/dashboard/index.tsx",
              '} from "lucide-react";\nimport { Button }',
              '} from "lucide-react";\nimport type { LucideIcon } from "lucide-react";\nimport { Button }',
          )
          replace("src/routes/dashboard/index.tsx", "  icon: any;", "  icon: LucideIcon;")

          replace(
              "src/routes/dashboard/mail/index.tsx",
              '} from "lucide-react";\nimport { Button }',
              '} from "lucide-react";\nimport type { LucideIcon } from "lucide-react";\nimport { Button }',
          )
          replace("src/routes/dashboard/mail/index.tsx", "  icon: any;", "  icon: LucideIcon;")

          replace("supabase/functions/signing-actions/index.ts", "  let input: any;", "  let input: Record<string, unknown>;")
          replace("supabase/functions/signing-actions/index.ts", "      let finalization: any = null;", "      let finalization: unknown = null;")

          replace(
              "supabase/functions/signing-external/index.ts",
              "  client: any,",
              "  client: ReturnType<typeof createClient>,",
          )
          replace("supabase/functions/signing-external/index.ts", "  let input: any;", "  let input: Record<string, unknown>;")
          replace(
              "supabase/functions/signing-external/index.ts",
              "      const field = (payload?.fields ?? []).find((candidate: any) => candidate.id === fieldId);\n      if (!field || ![\"signature\", \"initial\"].includes(field.type)) {",
              "      const field = (payload?.fields ?? []).find(\n        (candidate: { id?: string }) => candidate.id === fieldId,\n      );\n      if (!field || ![\"signature\", \"initial\"].includes(String(field.type ?? \"\"))) {",
          )
          replace(
              "supabase/functions/signing-external/index.ts",
              '      const decoded = decodeSignature(String(input?.imageBase64 ?? ""), input?.mimeType);',
              '      const decoded = decodeSignature(\n        String(input?.imageBase64 ?? ""),\n        typeof input?.mimeType === "string" ? input.mimeType : undefined,\n      );',
          )
          replace(
              "supabase/functions/signing-external/index.ts",
              "      let finalization: any = null;",
              "      let finalization:\n        | (Record<string, unknown> & {\n            finalExportPath?: string;\n            certificatePath?: string;\n            finalDownloadUrl?: string | null;\n            certificateDownloadUrl?: string | null;\n          })\n        | null = null;",
          )

          finalize = Path("supabase/functions/signing-finalize/index.ts")
          text = finalize.read_text()
          marker = 'const corsHeaders = {\n'
          if marker not in text:
              raise SystemExit("Finalizer marker not found")
          types = '''interface FinalizationPayload {\n  request: {\n    id: string;\n    workspaceId: string;\n    documentId: string;\n    sourceDocumentVersionId: string | null;\n    title: string;\n    participantsHash: string;\n    fieldsHash: string;\n  };\n  source?: { storagePath?: string | null; fileUrl?: string | null };\n  participants?: Array<{\n    id: string;\n    fullName?: string | null;\n    email?: string | null;\n    role: string;\n    status: string;\n    signedAt?: string | null;\n  }>;\n  events?: Array<{\n    createdAt: string;\n    eventType: string;\n    eventHash?: string | null;\n  }>;\n  fields?: Array<{\n    id: string;\n    page: number | string;\n    x: number | string;\n    y: number | string;\n    w: number | string;\n    h: number | string;\n    rotation?: number | string | null;\n    type: string;\n    signatureStoragePath?: string | null;\n    value?: unknown;\n  }>;\n}\n\n'''
          text = text.replace(marker, types + marker, 1)
          text = text.replace("  client: any,", "  client: ReturnType<typeof createClient>,", 1)
          text = text.replace(
              "  payload: any,\n  sourceHash: string,\n  finalHash: string,\n): Promise<{ bytes: Uint8Array; manifest: any }>",
              "  payload: FinalizationPayload,\n  sourceHash: string,\n  finalHash: string,\n): Promise<{ bytes: Uint8Array; manifest: Record<string, unknown> }>",
              1,
          )
          text = text.replace("  let input: any;", "  let input: Record<string, unknown>;", 1)
          old = '''    if (claimError) throw new Error(claimError.message);\n    claimed = true;\n\n    const sourceRef = payload?.source?.storagePath || payload?.source?.fileUrl;'''
          new = '''    if (claimError) throw new Error(claimError.message);\n    claimed = true;\n    const finalizationPayload = payload as FinalizationPayload;\n\n    const sourceRef =\n      finalizationPayload.source?.storagePath || finalizationPayload.source?.fileUrl;'''
          if old not in text:
              raise SystemExit("Finalizer payload insertion point not found")
          text = text.replace(old, new, 1)
          for old_value, new_value in [
              ("for (const field of payload.fields ?? [])", "for (const field of finalizationPayload.fields ?? [])"),
              ("      payload,\n      sourceHash,", "      finalizationPayload,\n      sourceHash,"),
              ("const workspaceId = payload.request.workspaceId;", "const workspaceId = finalizationPayload.request.workspaceId;"),
          ]:
              if old_value not in text:
                  raise SystemExit(f"Finalizer pattern not found: {old_value!r}")
              text = text.replace(old_value, new_value, 1)
          finalize.write_text(text)
          PY

      - name: Format changed source
        run: bunx prettier --write src/routes/dashboard/documents/index.tsx src/routes/dashboard/index.tsx src/routes/dashboard/mail/index.tsx supabase/functions/signing-actions/index.ts supabase/functions/signing-external/index.ts supabase/functions/signing-finalize/index.ts

      - name: Verify ESLint
        run: bunx eslint .

      - name: Commit semantic fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dashboard/documents/index.tsx src/routes/dashboard/index.tsx src/routes/dashboard/mail/index.tsx supabase/functions/signing-actions/index.ts supabase/functions/signing-external/index.ts supabase/functions/signing-finalize/index.ts
          git commit -m "fix: type upgrade lint blockers"
          git push origin HEAD:phase-0-canonical-reconciliation
