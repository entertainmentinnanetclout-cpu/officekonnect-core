name: Phase 2 Editor Correction
on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths: [.github/workflows/phase2-editor-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Correct editor source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/document/native-document-editor.tsx')
          s=p.read_text()
          pairs=[
            ('  type MouseEvent as ReactMouseEvent,\n','  type MouseEvent as ReactMouseEvent,\n  type ReactNode,\n'),
            ('import { useQuery, useQueryClient } from "@tanstack/react-query";','import { useQuery } from "@tanstack/react-query";'),
            ('children: React.ReactNode;','children: ReactNode;'),
            ('  const queryClient = useQueryClient();\n',''),
            ('document.addEventListener("selectionchange", handleSelectionChange);','window.document.addEventListener("selectionchange", handleSelectionChange);'),
            ('document.removeEventListener("selectionchange", handleSelectionChange);','window.document.removeEventListener("selectionchange", handleSelectionChange);'),
            ('document.execCommand(command, false, value);','window.document.execCommand(command, false, value);'),
          ]
          for old,new in pairs:
            if old not in s: raise SystemExit(f'missing guarded pattern: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          bunx prettier --write src/components/document/native-document-editor.tsx
          bunx eslint src/components/document/native-document-editor.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/document/native-document-editor.tsx
          git commit -m "fix(phase2): harden native editor DOM handling"
          git push origin HEAD:phase-0-canonical-reconciliation
