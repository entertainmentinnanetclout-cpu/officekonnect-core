name: DOCX Lock Sync

on:
  push:
    branches: [fix/docx-fidelity]

permissions:
  contents: write

concurrency:
  group: docx-lock-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/docx-fidelity
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Reconcile Bun lockfile
        run: bun install
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: lock DOCX fidelity dependencies"
          git push origin HEAD:fix/docx-fidelity
