name: Upgrade Normalize Repository

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/phase0-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Refresh canonical lockfile
        run: bun install --lockfile-only

      - name: Verify frozen install
        run: bun ci

      - name: Format upgrade sources
        run: >-
          bunx prettier --write
          scripts/check-phase0-parity.mjs
          src/components/brevo-onboarding.tsx
          src/components/document/send-document-dialog.tsx
          src/components/document/pdf-workspace.tsx
          src/components/officekonnect-shell.tsx
          src/hooks/use-workspace-shell.ts
          src/lib/development-session.functions.ts
          src/lib/documents.functions.ts
          src/lib/signing.functions.ts
          src/routes/auth.tsx
          src/routes/dashboard.tsx

      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock scripts/check-phase0-parity.mjs src/components/brevo-onboarding.tsx src/components/document/send-document-dialog.tsx src/components/document/pdf-workspace.tsx src/components/officekonnect-shell.tsx src/hooks/use-workspace-shell.ts src/lib/development-session.functions.ts src/lib/documents.functions.ts src/lib/signing.functions.ts src/routes/auth.tsx src/routes/dashboard.tsx
          if git diff --cached --quiet; then
            echo "No normalization changes required."
          else
            git commit -m "chore: refresh Bun lock and normalize Phase 1 sources"
            git push origin HEAD:phase-0-canonical-reconciliation
          fi
