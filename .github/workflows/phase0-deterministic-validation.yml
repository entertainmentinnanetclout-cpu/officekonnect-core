name: Upgrade Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-0-canonical-reconciliation]

permissions:
  contents: write

jobs:
  phase4-typefix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun ci
      - name: Apply type repair
        run: python3 scripts/phase4-typefix.py
      - name: Format source
        run: bunx prettier --write src/lib/files.functions.ts
      - name: Lint patched source
        run: bun run lint
      - name: TypeScript patched source
        run: bun run typecheck
      - name: Tests patched source
        run: bun run test
      - name: Build patched source
        run: bun run build
      - name: Commit validated type repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/files.functions.ts src/routeTree.gen.ts
          git commit -m "fix(phase4): type folder ancestry traversal"
          git fetch origin phase-0-canonical-reconciliation
          git rebase origin/phase-0-canonical-reconciliation
          git push origin HEAD:phase-0-canonical-reconciliation

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Repository parity
        run: bun run phase0:parity
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: TypeScript
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
