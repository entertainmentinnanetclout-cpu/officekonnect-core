name: Phase 10 Playwright Lock Once

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths: [.github/workflows/phase10-playwright-lock-once.yml]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Pin Playwright in the Bun lock
        run: bun add --dev --exact @playwright/test@1.62.1
      - name: Reconcile browser scripts
        shell: python
        run: |
          from pathlib import Path
          import json
          package = Path("package.json")
          data = json.loads(package.read_text())
          data["scripts"]["test:e2e"] = "playwright test"
          package.write_text(json.dumps(data, indent=2) + "\n")
          workflow = Path(".github/workflows/phase0-deterministic-validation.yml")
          text = workflow.read_text()
          text = text.replace(
              "npx --yes @playwright/test@1.62.1 install --with-deps chromium",
              "bunx playwright install --with-deps chromium",
          )
          workflow.write_text(text)
      - run: bunx prettier --write package.json .github/workflows/phase0-deterministic-validation.yml
      - name: Commit deterministic browser tooling
        run: |
          git config user.name "officekonnect-phase10-playwright"
          git config user.email "actions@users.noreply.github.com"
          git add package.json bun.lock .github/workflows/phase0-deterministic-validation.yml
          git commit -m "test(phase10): pin Playwright browser tooling"
          git push origin HEAD:phase-0-canonical-reconciliation
