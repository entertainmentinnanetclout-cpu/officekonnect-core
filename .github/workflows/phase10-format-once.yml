# trigger one canonical formatting pass
name: Phase 10 Format Once

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths: [.github/workflows/phase10-format-once.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bunx prettier --write e2e/public-routes.spec.ts scripts/check-build-budget.mjs scripts/check-security-boundaries.mjs supabase/functions/_shared/signing-pdf.ts tests/signing-finalization-pdf.integration.test.ts supabase/functions/signing-finalize/index.ts playwright.config.ts
      - run: |
          git config user.name "officekonnect-phase10-format"
          git config user.email "actions@users.noreply.github.com"
          git add e2e scripts supabase/functions tests playwright.config.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(phase10): apply canonical formatting"
          git push origin HEAD:phase-0-canonical-reconciliation
