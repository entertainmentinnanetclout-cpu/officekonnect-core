name: Phase 10 Route Registry Sync

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths: [.github/workflows/phase10-route-sync-once.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Generate TanStack route registry
        run: bun run build
      - name: Format changed product files
        run: bunx prettier --write src/routes/index.tsx src/routes/privacy.tsx src/routes/terms.tsx e2e/public-routes.spec.ts
      - name: Commit generated route registry
        run: |
          git config user.name "officekonnect-phase10-routes"
          git config user.email "actions@users.noreply.github.com"
          git add src/routeTree.gen.ts src/routes/index.tsx src/routes/privacy.tsx src/routes/terms.tsx e2e/public-routes.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(phase10): synchronize public legal routes"
          git push origin HEAD:phase-0-canonical-reconciliation
