name: Upgrade Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Repository parity
        run: bun run phase0:parity
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Product hardening audit
        run: bun run audit:product
      - name: Security boundary audit
        run: bun run audit:security
      - name: Release candidate audit
        run: bun run audit:release
      - name: TypeScript
        run: bun run typecheck
      - name: Unit and integration tests
        run: bun run test
      - name: Clone-safe Vercel production build
        env:
          VERCEL: "1"
          VERCEL_ENV: "preview"
          SUPABASE_URL: ""
          SUPABASE_PUBLISHABLE_KEY: ""
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
        run: bun run build
      - name: Verify Vercel output contract
        shell: bash
        run: |
          test -f .vercel/output/config.json || {
            echo "Vercel build did not produce .vercel/output/config.json" >&2
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          }
          test -d .vercel/output/functions || {
            echo "Vercel build did not produce a functions directory" >&2
            find .vercel/output -maxdepth 4 -type f | sort
            exit 1
          }
          test -d .vercel/output/static || {
            echo "Vercel build did not produce static assets" >&2
            find .vercel/output -maxdepth 4 -type f | sort
            exit 1
          }
      - name: Production asset budget
        run: bun run audit:performance
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - name: Resolve runner Chromium executable
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No runner-provisioned Chromium browser was found." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Clone-safe browser E2E
        env:
          VERCEL: "1"
          VERCEL_ENV: "preview"
          SUPABASE_URL: ""
          SUPABASE_PUBLISHABLE_KEY: ""
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
        run: bun run test:e2e
