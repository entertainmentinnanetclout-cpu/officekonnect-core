name: Upgrade Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-0-canonical-reconciliation]

permissions:
  contents: write

jobs:
  sync-route-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun ci
      - name: Generate route registry
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
        run: bun run build
      - name: Commit generated route registry
        run: |
          git add src/routeTree.gen.ts
          git diff --cached --quiet && exit 0
          git config user.name "officekonnect-route-registry"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(phase10): regenerate TanStack route registry"
          git push origin HEAD:phase-0-canonical-reconciliation

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Repository parity
        run: bun run phase0:parity
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Product hardening audit
        run: bun run audit:product
      - name: Security boundary audit
        run: bun run audit:security
      - name: TypeScript
        run: bun run typecheck
      - name: Unit and integration tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Production asset budget
        run: bun run audit:performance
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: bun run test:e2e
