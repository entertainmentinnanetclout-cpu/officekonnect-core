name: Upgrade Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-0-canonical-reconciliation]

permissions:
  contents: write

jobs:
  phase2-editor-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Anchor paragraph serializer patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/phase2-editor-patch.py")
          text = path.read_text()
          old = '''s = replace_once(\n    s,\n    "      align: elementAlignment(node),\\n",\n    "      align: elementAlignment(node),\\n      indent,\\n",\n    "paragraph indent serializer",\n)'''
          new = '''s = replace_once(\n    s,\n    "\\n      align: elementAlignment(node),\\n",\n    "\\n      align: elementAlignment(node),\\n      indent,\\n",\n    "paragraph indent serializer",\n)'''
          if text.count(old) != 1:
              raise SystemExit(f"paragraph patch-script block count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply Phase 2 editor patch
        run: python3 scripts/phase2-editor-patch.py

      - name: Format patched source
        run: bunx prettier --write src/components/document/native-document-editor.tsx src/lib/documents.functions.ts

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/document/native-document-editor.tsx src/lib/documents.functions.ts
          git commit -m "feat(phase2): harden native editor persistence and exports"
          git push origin HEAD:phase-0-canonical-reconciliation

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Repository parity
        run: bun run phase0:parity

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build
