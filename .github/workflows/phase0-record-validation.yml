name: Phase 0 Record Validation

on:
  push:
    branches: [phase-0-canonical-reconciliation]
    paths:
      - .github/workflows/phase0-record-validation.yml

permissions:
  contents: write

jobs:
  validate-and-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: phase-0-canonical-reconciliation

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Repository parity
        id: parity
        continue-on-error: true
        run: npm run phase0:parity

      - name: Deterministic install
        id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: TypeScript
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Write validation report
        if: always()
        env:
          PARITY: ${{ steps.parity.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          cat > docs/PHASE0_VALIDATION.md <<EOF
          # Phase 0 Validation

          Recorded by GitHub Actions against branch \`phase-0-canonical-reconciliation\`.

          | Gate | Result |
          |---|---|
          | Repository parity | ${PARITY} |
          | Deterministic npm install | ${INSTALL} |
          | ESLint | ${LINT} |
          | TypeScript | ${TYPECHECK} |
          | Production build | ${BUILD} |

          Validation source SHA: \`${VALIDATED_SHA}\`
          EOF

      - name: Commit validation report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE0_VALIDATION.md
          if git diff --cached --quiet; then
            echo "Validation report unchanged."
          else
            git commit -m "docs: record Phase 0 validation results"
            git push origin HEAD:phase-0-canonical-reconciliation
          fi
